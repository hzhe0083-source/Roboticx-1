const xml = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<mxfile host=\"app.diagrams.net\" agent=\"Codex\" version=\"26.0.9\" pages=\"1\">\n  <diagram id=\"va-qkv-component\" name=\"VA QKV Component\">\n    <mxGraphModel dx=\"1800\" dy=\"620\" grid=\"1\" gridSize=\"10\" guides=\"1\" tooltips=\"1\" connect=\"1\" arrows=\"1\" fold=\"1\" page=\"1\" pageScale=\"1\" pageWidth=\"1800\" pageHeight=\"620\" math=\"0\" shadow=\"0\">\n      <root>\n        <mxCell id=\"0\" />\n        <mxCell id=\"1\" parent=\"0\" />\n\n        <mxCell id=\"title\" value=\"&lt;b&gt;VA component \u00b7 Q/K/V flow&lt;/b&gt;\" style=\"text;html=1;strokeColor=none;fillColor=none;whiteSpace=wrap;fontFamily=Helvetica;fontSize=22;fontColor=#262626;align=center;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"620\" y=\"10\" width=\"560\" height=\"35\" as=\"geometry\" />\n        </mxCell>\n\n        <mxCell id=\"va_input\" value=\"&lt;b&gt;VA snapshot&lt;/b&gt;&lt;br&gt;V&lt;sub&gt;i\u22121&lt;/sub&gt;, A&lt;sub&gt;i\u22121&lt;/sub&gt;\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFDFDF;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=17;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"30\" y=\"245\" width=\"170\" height=\"110\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"q_proj\" value=\"&lt;b&gt;Q projection&lt;/b&gt;&lt;br&gt;Q=[W&lt;sub&gt;Q&lt;/sub&gt;&lt;sup&gt;V&lt;/sup&gt;V ; W&lt;sub&gt;Q&lt;/sub&gt;&lt;sup&gt;A&lt;/sup&gt;A]\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#D9DFF2;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=16;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"250\" y=\"265\" width=\"230\" height=\"100\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"local_kv\" value=\"&lt;b&gt;Local K,V&lt;/b&gt;&lt;br&gt;Proj(V, A, M&lt;sup&gt;V&lt;/sup&gt;, L)\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#D9DFF2;stroke gt;FFN&lt;/b&gt;\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#B7E9FB;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=16;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"1210\" y=\"295\" width=\"110\" height=\"80\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"add2\" value=\"&lt;b&gt;Residual Add&lt;/b&gt;\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#F1F4B9;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=15;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"1380\" y=\"295\" width=\"120\" height=\"80\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"va_output\" value=\"&lt;b&gt;VA output&lt;/b&gt;&lt;br&gt;V&lt;sub&gt;i&lt;/sub&gt;, A&lt;sub&gt;i&lt;/sub&gt;\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFDFDF;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=17;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"1560\" y=\"245\" width=\"170\" height=\"110\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"e_input_q\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\" edge=\"1\" parent=\"1\" source=\"va_input\" target=\"q_proj\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_input_local\" value=\"V,A\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=0.5;exitY=0;entryX=0;entryY=0.5;fontFamily=Helvetica;fontSize=12;fontColor=#262626;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"va_input\" target=\"local_kv\">\n          <mxGeometry relative=\"1\" as=\"geometry\"><Array as=\"points\"><mxPoint x=\"115\" y=\"115\" /></Array></mxGeometry>\n        </mxCell>\n        <mxCell id=\"e_q_attn\" value=\"Q\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=1;exitY=0.5;entryX=0;entryY=0.55;fontFamily=Helvetica;fontSize=13;fontColor=#262626;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"q_proj\" target=\"attention\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_local_merge\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=0.5;exitY=1;entryX=0.2;entryY=0;\" edge=\"1\" parent=\"1\" source=\"local_kv\" target=\"kv_merge\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_wm_merge\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#4D78B8;strokeWidth=2;exitX=0.5;exitY=1;entryX=0.8;entryY=0;\" edge=\"1\" parent=\"1\" source=\"wm_kv\" target=\"kv_merge\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_merge_attn\" value=\"K,V\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=0.5;exitY=1;entryX=0.5;entryY=0;fontFamily=Helvetica;fontSize=13;fontColor=#262626;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"kv_merge\" target=\"attention\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_attn_add1\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\" edge=\"1\" parent=\"1\" source=\"attention\" target=\"add1\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_add1_ffn\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\" edge=\"1\" parent=\"1\" source=\"add1\" target=\"ffn\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_ffn_add2\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\" edge=\"1\" parent=\"1\" source=\"ffn\" target=\"add2\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_add2_output\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\" edge=\"1\" parent=\"1\" source=\"add2\" target=\"va_output\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_residual1\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#646464;strokeWidth=1.5;exitX=0.5;exitY=1;entryX=0.5;entryY=1;\" edge=\"1\" parent=\"1\" source=\"va_input\" target=\"add1\">\n          <mxGeometry relative=\"1\" as=\"geometry\"><Array as=\"points\"><mxPoint x=\"115\" y=\"500\" /><mxPoint x=\"1090\" y=\"500\" /></Array></mxGeometry>\n        </mxCell>\n        <mxCell id=\"e_residual2\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#646464;strokeWidth=1.5;exitX=0.5;exitY=0;entryX=0.5;entryY=0;\" edge=\"1\" parent=\"1\" source=\"add1\" target=\"add2\">\n          <mxGeometry relative=\"1\" as=\"geometry\"><Array as=\"points\"><mxPoint x=\"1090\" y=\"225\" /><mxPoint x=\"1440\" y=\"225\" /></Array></mxGeometry>\n        </mxCell>\n      </root>\n    </mxGraphModel>\n  </diagram>\n</mxfile>\n";
const diagramTitle = "va_internal_simple_landscape.drawio";
const DRAWIO_ORIGIN = 'https://embed.diagrams.net';
const iframe = document.getElementById('drawio');
let loaded = false;
function downloadXml(savedXml) {
  const blob = new Blob([savedXml], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const cleanTitle = diagramTitle.endsWith('.drawio') ? diagramTitle : `${diagramTitle}.drawio`;
  link.href = url;
  link.download = cleanTitle;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function sendLoad() {
  iframe.contentWindow.postMessage(JSON.stringify({
    action: 'load',
    autosave: 0,
    modified: 0,
    title: diagramTitle,
    xml
  }), DRAWIO_ORIGIN);
}
window.__drawioPreview = {
  requestSave: () => iframe.contentWindow.postMessage(JSON.stringify({ action: 'save' }), DRAWIO_ORIGIN)
};
window.addEventListener('message', (evt) => {
  if (evt.source !== iframe.contentWindow || evt.origin !== DRAWIO_ORIGIN) return;
  let msg = evt.data;
  try { if (typeof msg === 'string') msg = JSON.parse(msg); } catch (e) { return; }
  if (!msg) return;
  if (msg.event === 'save' && msg.xml) {
    downloadXml(msg.xml);
    iframe.contentWindow.postMessage(JSON.stringify({
      action: 'status',
      modified: false,
      message: 'Downloaded .drawio file'
    }), DRAWIO_ORIGIN);
    return;
  }
  if (!loaded && (msg.event === 'init' || msg.event === 'configure')) {
    loaded = true;
    sendLoad();
  }
});
setTimeout(() => { if (!loaded) sendLoad(); }, 2500);
</script>
