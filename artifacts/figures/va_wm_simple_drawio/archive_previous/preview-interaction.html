eometry\" /></mxCell>\n        <mxCell id=\"e_va_to_wm\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#E66B19;strokeWidth=3;exitX=1;exitY=0.5;entryX=0;entryY=0.35;\" edge=\"1\" parent=\"1\" source=\"snapshot_va\" target=\"wm_core\">\n          <mxGeometry relative=\"1\" as=\"geometry\"><Array as=\"points\"><mxPoint x=\"790\" y=\"106\" /><mxPoint x=\"790\" y=\"285\" /><mxPoint x=\"960\" y=\"285\" /><mxPoint x=\"960\" y=\"348\" /></Array></mxGeometry>\n        </mxCell>\n        <mxCell id=\"e_wm_to_va\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;jumpStyle=arc;jumpSize=8;endArrow=classic;endFill=1;strokeColor=#4D78B8;strokeWidth=3;exitX=0;exitY=0.5;entryX=1;entryY=0.65;\" edge=\"1\" parent=\"1\" source=\"snapshot_wm\" target=\"va_core\">\n          <mxGeometry relative=\"1\" as=\"geometry\"><Array as=\"points\"><mxPoint x=\"820\" y=\"106\" /><mxPoint x=\"820\" y=\"540\" /><mxPoint x=\"700\" y=\"540\" /><mxPoint x=\"700\" y=\"377\" /></Array></mxGeometry>\n        </mxCell>\n        <mxCell id=\"e_va_internal\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\" edge=\"1\" parent=\"1\" source=\"va_core\" target=\"va_out\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_wm_internal\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\" edge=\"1\" parent=\"1\" source=\"wm_core\" target=\"wm_out\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_va_commit\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\" edge=\"1\" parent=\"1\" source=\"va_out\" target=\"commit_va\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_wm_commit\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\" edge=\"1\" parent=\"1\" source=\"wm_out\" target=\"commit_wm\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n      </root>\n    </mxGraphModel>\n  </diagram>\n</mxfile>\n";
const diagramTitle = "va_wm_interaction_simple_landscape.drawio";
const DRAWIO_ORIGIN = 'https://embed.diagrams.net';
const iframe = document.getElementById('drawio');
let loaded = false;
function downloadXml(savedXml) {
  const blob = new Blob([savedXml], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const cleanTitle = diagramTitle.endsWith('.drawio') ? diagramTitle : `${diagramTitle}.drawio`;
  link.href = url;
  link.download = cleanTitle;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function sendLoad() {
  iframe.contentWindow.postMessage(JSON.stringify({
    action: 'load',
    autosave: 0,
    modified: 0,
    title: diagramTitle,
    xml
  }), DRAWIO_ORIGIN);
}
window.__drawioPreview = {
  requestSave: () => iframe.contentWindow.postMessage(JSON.stringify({ action: 'save' }), DRAWIO_ORIGIN)
};
window.addEventListener('message', (evt) => {
  if (evt.source !== iframe.contentWindow || evt.origin !== DRAWIO_ORIGIN) return;
  let msg = evt.data;
  try { if (typeof msg === 'string') msg = JSON.parse(msg); } catch (e) { return; }
  if (!msg) return;
  if (msg.event === 'save' && msg.xml) {
    downloadXml(msg.xml);
    iframe.contentWindow.postMessage(JSON.stringify({
      action: 'status',
      modified: false,
      message: 'Downloaded .drawio file'
    }), DRAWIO_ORIGIN);
    return;
  }
  if (!loaded && (msg.event === 'init' || msg.event === 'configure')) {
    loaded = true;
    sendLoad();
  }
});
setTimeout(() => { if (!loaded) sendLoad(); }, 2500);
</script>
