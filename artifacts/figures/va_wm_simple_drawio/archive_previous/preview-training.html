<style>

<body>
<iframe id="drawio" src="https://embed.diagrams.net/?embed=1&proto=json&spin=1&ui=atlas&libraries=0&grid=0&pv=0"></iframe>
<script>
const xml = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<mxfile host=\"app.diagrams.net\" agent=\"Codex\" version=\"26.0.9\" pages=\"1\">\n  <diagram id=\"va-wm-training-component\" name=\"VA-WM Training\">\n    <mxGraphModel dx=\"1300\" dy=\"580\" grid=\"1\" gridSize=\"10\" guides=\"1\" tooltips=\"1\" connect=\"1\" arrows=\"1\" fold=\"1\" page=\"1\" pageScale=\"1\" pageWidth=\"1300\" pageHeight=\"580\" math=\"0\" shadow=\"0\">\n      <root>\n        <mxCell id=\"0\" />\n        <mxCell id=\"1\" parent=\"0\" />\n\n        <mxCell id=\"title\" value=\"&lt;b&gt;VA / WM training&lt;/b&gt;\" style=\"text;html=1;strokeColor=none;fillColor=none;whiteSpace=wrap;fontFamily=Helvetica;fontSize=22;fontColor=#262626;align=center;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"475\" y=\"15\" width=\"400\" height=\"35\" as=\"geometry\" />\n        </mxCell>\n\n        <mxCell id=\"va_target\" value=\"&lt;b&gt;VA batch \u00b7 action target a*&lt;/b&gt;\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFDFDF;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=16;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"90\" y=\"85\" width=\"420\" height=\"55\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"wm_target\" value=\"&lt;b&gt;Independent WM batch \u00b7 next DINO Z*&lt;/b&gt;&lt;br&gt;target stop-grad\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#B7E9FB;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=15;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"840\" y=\"85\" width=\"420\" height=\"55\" as=\"geometry\" />\n        </mxCell>\n\n        <mxCell id=\"va_loss\" value=\"&lt;b&gt;VA \u00b7 Flow matching&lt;/b&gt;&lt;br&gt;x&lt;sub&gt;\u03c4&lt;/sub&gt;=(1\u2212\u03c4)\u03b5+\u03c4a* ; u*=a*\u2212\u03b5&lt;br&gt;L&lt;sub&gt;VA&lt;/sub&gt;=MaskedMSE(v&lt;sub&gt;\u03b8&lt;/sub&gt;(x&lt;sub&gt;\u03c4&lt;/sub&gt;,\u03c4),u*)&lt;br&gt;&lt;font color=&quot;#646464&quot;&gt;prefix / tail weighted&lt;/font&gt;\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFE2B2;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=16;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"90\" y=\"205\" width=\"420\" height=\"145\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"wm_loss\" value=\"&lt;b&gt;WM predictor / L&lt;sub&gt;WM&lt;/sub&gt;&lt;/b&gt;&lt;br&gt;WM batch: L&lt;sub&gt;i&lt;/sub&gt;=.25L&lt;sub&gt;all&lt;/sub&gt;+.25L&lt;sub&gt;motion&lt;/sub&gt;+.50L&lt;sub&gt;top20&lt;/sub&gt;+L&lt;sub&gt;NR(all)&lt;/sub&gt;&lt;br&gt;L&lt;sub&gt;WM&lt;/sub&gt;=Avg&lt;sub&gt;w&lt;/sub&gt;(L&lt;sub&gt;i&lt;/sub&gt;)+4L&lt;sub&gt;static&lt;/sub&gt;+L&lt;sub&gt;rank&lt;/sub&gt;+L&lt;sub&gt;readout&lt;/sub&gt;\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#B7E9FB;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=16;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"840\" y=\"205\" width=\"420\" height=\"145\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"belief_training\" value=\"&lt;b&gt;B&lt;sub&gt;i&lt;/sub&gt;, \u03bd&lt;sub&gt;i&lt;/sub&gt;: no direct target&lt;/b&gt;&lt;br&gt;trained through L&lt;sub&gt;WM&lt;/sub&gt;\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#F1F4B9;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=14;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"545\" y=\"85\" width=\"260\" height=\"55\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"optimizer\" value=\"&lt;b&gt;VA backward + WM backward&lt;/b&gt;&lt;br&gt;separate batches \u00b7 one optimizer step\" style=\"rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#C3E9CC;strokeColor=#262626;strokeWidth=2;fontFamily=Helvetica;fontSize=18;fontColor=#262626;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"470\" y=\"440\" width=\"410\" height=\"85\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"joint_note\" value=\"L&lt;sub&gt;WM&lt;/sub&gt; also shapes the VA snapshot features read by WM\" style=\"text;html=1;strokeColor=none;fillColor=none;whiteSpace=wrap;fontFamily=Helvetica;fontSize=13;fontColor=#646464;align=center;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"390\" y=\"550\" width=\"570\" height=\"28\" as=\"geometry\" />\n        </mxCell>\n\n        <mxCell id=\"e_target_va\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\" edge=\"1\" parent=\"1\" source=\"va_target\" target=\"va_loss\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_target_wm\" value=\"\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#262626;strokeWidth=2;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\" edge=\"1\" parent=\"1\" source=\"wm_target\" target=\"wm_loss\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_va_optimizer\" value=\"L&lt;sub&gt;VA&lt;/sub&gt;\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#E66B19;strokeWidth=2.5;exitX=0.5;exitY=1;entryX=0;entryY=0.5;fontFamily=Helvetica;fontSize=13;fontColor=#E66B19;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"va_loss\" target=\"optimizer\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_wm_optimizer\" value=\"L&lt;sub&gt;WM&lt;/sub&gt;\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;endFill=1;strokeColor=#4D78B8;strokeWidth=2.5;exitX=0.5;exitY=1;entryX=1;entryY=0.5;fontFamily=Helvetica;fontSize=13;fontColor=#4D78B8;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"wm_loss\" target=\"optimizer\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_gradient_boundary\" value=\"VA-batch forward: sg(Z) \u2192 K&lt;sup&gt;W&lt;/sup&gt;,V&lt;sup&gt;W&lt;/sup&gt; \u00b7 no L&lt;sub&gt;VA&lt;/sub&gt; \u2192 predictor\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;dashed=1;endArrow=classic;endFill=1;strokeColor=#4D78B8;strokeWidth=2;exitX=0;exitY=0.5;entryX=1;entryY=0.5;fontFamily=Helvetica;fontSize=13;fontColor=#4D78B8;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"wm_loss\" target=\"va_loss\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n      </root>\n    </mxGraphModel>\n  </diagram>\n</mxfile>\n";
const diagramTitle = "VA WM Training";
const DRAWIO_ORIGIN = 'https://embed.diagrams.net';
const iframe = document.getElementById('drawio');
let loaded = false;
function downloadXml(savedXml) {
  const blob = new Blob([savedXml], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const cleanTitle = diagramTitle.endsWith('.drawio') ? diagramTitle : `${diagramTitle}.drawio`;
  link.href = url;
  link.download = cleanTitle;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function sendLoad() {
  iframe.contentWindow.postMessage(JSON.stringify({
    action: 'load',
    autosave: 0,
    modified: 0,
    title: diagramTitle,
    xml
  }), DRAWIO_ORIGIN);
}
window.__drawioPreview = {
  requestSave: () => iframe.contentWindow.postMessage(JSON.stringify({ action: 'save' }), DRAWIO_ORIGIN)
};
window.addEventListener('message', (evt) => {
  if (evt.source !== iframe.contentWindow || evt.origin !== DRAWIO_ORIGIN) return;
  let msg = evt.data;
  try { if (typeof msg === 'string') msg = JSON.parse(msg); } catch (e) { return; }
  if (!msg) return;
  if (msg.event === 'save' && msg.xml) {
    downloadXml(msg.xml);
    iframe.contentWindow.postMessage(JSON.stringify({
      action: 'status',
      modified: false,
      message: 'Downloaded .drawio file'
    }), DRAWIO_ORIGIN);
    return;
  }
  if (!loaded && (msg.event === 'init' || msg.event === 'configure')) {
    loaded = true;
    sendLoad();
  }
});
setTimeout(() => { if (!loaded) sendLoad(); }, 2500);
</script>
</body>
</html>
